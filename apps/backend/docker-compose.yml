services:
  api:
    build: .
    container_name: implementr-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    restart: unless-stopped

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000

  worker:
    build: .

    container_name: implementr-worker

    env_file:
      - .env

    restart: unless-stopped

    command: >
      python -m app.workers.runner
